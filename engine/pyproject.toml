[project]
name = "kubecost-engine"
version = "0.1.0"
description = "Unit Economics Scaling engine for KubeCost Auto-HPA"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["kubecost_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
