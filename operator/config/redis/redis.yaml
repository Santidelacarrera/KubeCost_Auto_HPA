# Cache only (metrics + temporary scaling state): losing it is safe, so no persistence.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-auto-hpa-redis
  labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: redis}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: redis}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: redis}
    spec:
      containers:
      - name: redis
        image: redis:7.4-alpine
        args: ["--save", "", "--appendonly", "no", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
        ports: [{name: redis, containerPort: 6379}]
        readinessProbe: {exec: {command: [redis-cli, ping]}}
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 96Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-auto-hpa-redis
spec:
  selector: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: redis}
  ports: [{name: redis, port: 6379, targetPort: redis}]
