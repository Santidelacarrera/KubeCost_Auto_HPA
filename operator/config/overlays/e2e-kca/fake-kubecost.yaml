# Deterministic stand-in for KubeCost's /model/allocation, used only by the kind end-to-end test.
# One accumulated set with a cheap, fresh allocation for kca/load: the budget never binds, so
# the test exercises demand-driven scaling through the real cost-ingestion path.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-kubecost
  namespace: kubecost-auto-hpa-system
data:
  server.py: |
    import json, datetime
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            end = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
            alloc = {"name": "kca/load", "properties": {"namespace": "kca", "controller": "load",
                     "controllerKind": "deployment"}, "minutes": 15, "end": end, "totalCost": 0.0025}
            body = json.dumps({"code": 200, "data": [{"kca/load": alloc}]}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    HTTPServer(("0.0.0.0", 9090), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-kubecost
  namespace: kubecost-auto-hpa-system
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-kubecost}}
  template:
    metadata: {labels: {app: fake-kubecost}}
    spec:
      containers:
      - name: server
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports: [{containerPort: 9090}]
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: fake-kubecost}}]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-kubecost
  namespace: kubecost-auto-hpa-system
spec:
  selector: {app: fake-kubecost}
  ports: [{port: 9090}]
