# Deterministic stand-in for Prometheus used only by the kind end-to-end test.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fake-prometheus
  namespace: kubecost-auto-hpa-system
data:
  server.py: |
    import json, urllib.parse
    from http.server import BaseHTTPRequestHandler, HTTPServer
    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            q = urllib.parse.parse_qs(urllib.parse.urlparse(self.path).query).get("query", [""])[0]
            v = "200"                                   # http_requests_total: 200 rps
            if "histogram_quantile" in q: v = "50"      # p99 50ms (SLO is 250ms)
            elif "container_cpu" in q: v = "100"        # 100m CPU per pod
            elif "container_memory" in q: v = "100"     # 100 MiB per pod
            body = json.dumps({"status": "success", "data": {"resultType": "vector",
                   "result": [{"metric": {}, "value": [0, v]}]}}).encode()
            self.send_response(200); self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body))); self.end_headers(); self.wfile.write(body)
        def log_message(self, *a): pass
    HTTPServer(("0.0.0.0", 9090), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-prometheus
  namespace: kubecost-auto-hpa-system
spec:
  replicas: 1
  selector: {matchLabels: {app: fake-prometheus}}
  template:
    metadata: {labels: {app: fake-prometheus}}
    spec:
      containers:
      - name: server
        image: python:3.12-slim
        command: ["python", "/app/server.py"]
        ports: [{containerPort: 9090}]
        volumeMounts: [{name: app, mountPath: /app}]
      volumes: [{name: app, configMap: {name: fake-prometheus}}]
---
apiVersion: v1
kind: Service
metadata:
  name: fake-prometheus
  namespace: kubecost-auto-hpa-system
spec:
  selector: {app: fake-prometheus}
  ports: [{port: 9090}]
