apiVersion: v1
kind: Namespace
metadata:
  name: e2e
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: e2e
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        resources:
          requests: {cpu: 500m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
        resizePolicy: [{resourceName: cpu, restartPolicy: NotRequired}]
---
apiVersion: autoscaling.kubecost.io/v1alpha1
kind: KubeCostHPA
metadata:
  name: web
  namespace: e2e
spec:
  targetRef: {name: web}
  slo: {p99LatencyMs: 250}
  cpu: {min: 100m, max: "2"}
  cooldown: 5s
  interval: 5s
