apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubecost-auto-hpa-leader-election
rules:
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubecost-auto-hpa-leader-election
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubecost-auto-hpa-leader-election
subjects:
- kind: ServiceAccount
  name: kubecost-auto-hpa
  namespace: kubecost-auto-hpa-system
