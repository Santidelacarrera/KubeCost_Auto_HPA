apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-auto-hpa-engine
  labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: engine}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: engine}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: engine}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: engine
        image: ghcr.io/santidelacarrera/kubecost-auto-hpa-engine:latest
        ports: [{name: http, containerPort: 8000}]
        livenessProbe: {httpGet: {path: /healthz, port: http}}
        readinessProbe: {httpGet: {path: /healthz, port: http}}
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {memory: 128Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: kubecost-auto-hpa-engine
spec:
  selector: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: engine}
  ports: [{name: http, port: 8000, targetPort: http}]
