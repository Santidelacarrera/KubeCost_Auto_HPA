apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecost-auto-hpa-operator
  labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: operator}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: operator}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kubecost-auto-hpa, app.kubernetes.io/component: operator}
    spec:
      serviceAccountName: kubecost-auto-hpa
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: manager
        image: ghcr.io/santidelacarrera/kubecost-auto-hpa-operator:latest
        args: ["--leader-elect"]
        env:
        - {name: PROMETHEUS_URL, value: "http://prometheus-server.monitoring:80"}
        - {name: KUBECOST_URL, value: "http://kubecost-cost-analyzer.kubecost:9090"}
        - {name: ENGINE_URL, value: "http://kubecost-auto-hpa-engine:8000"}
        - {name: REDIS_ADDR, value: "kubecost-auto-hpa-redis:6379"}
        ports:
        - {name: metrics, containerPort: 8080}
        - {name: probes, containerPort: 8081}
        livenessProbe: {httpGet: {path: /healthz, port: probes}, initialDelaySeconds: 15}
        readinessProbe: {httpGet: {path: /readyz, port: probes}, initialDelaySeconds: 5}
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {memory: 256Mi}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
