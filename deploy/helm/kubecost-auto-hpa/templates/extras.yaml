{{- if .Values.operator.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kch.name" . }}-operator
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.operator.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "operator") | nindent 6 }}
---
{{- end }}
{{- if .Values.engine.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kch.name" . }}-engine
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.engine.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 6 }}
---
{{- end }}
{{- if .Values.networkPolicy.enabled }}
# Engine and Redis only accept traffic from the operator.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kch.name" . }}-engine
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "operator") | nindent 10 }}
    ports: [{port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kch.name" . }}-redis
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "redis") | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector:
        matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "operator") | nindent 10 }}
    ports: [{port: 6379}]
---
{{- end }}
{{- if and .Values.networkPolicy.operatorEgress.enabled .Values.networkPolicy.operatorEgress.rules }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "kch.name" . }}-operator-egress
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "operator") | nindent 6 }}
  policyTypes: [Egress]
  egress: {{- toYaml .Values.networkPolicy.operatorEgress.rules | nindent 4 }}
---
{{- end }}
{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "kch.name" . }}
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  groups:
  - name: kubecost-auto-hpa
    rules:
    - alert: KubeCostHPABudgetFrozen
      expr: kubecost_hpa_budget_frozen == 1
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "Autoscaling frozen by budget for {{ "{{ $labels.namespace }}/{{ $labels.name }}" }}"
    - alert: KubeCostHPASpotDrainFailing
      expr: increase(kubecost_spot_drains_total{result="failed"}[15m]) > 0
      labels: {severity: critical}
      annotations:
        summary: "Spot node drain failed: workloads may be interrupted ungracefully"
    # --- KubeCostAutoscaler ---
    - alert: KubeCostAutoscalerStaleCostData
      expr: kubecost_autoscaler_metric_age_seconds > 600
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "KubeCost data for {{ "{{ $labels.namespace }}/{{ $labels.name }}" }} is older than 10 minutes: scale-down is frozen"
    - alert: KubeCostAutoscalerKubeCostAPIErrors
      expr: sum by (class) (increase(kubecost_autoscaler_kubecost_api_errors_total[15m])) > 5
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "Persistent KubeCost API failures (class {{ "{{ $labels.class }}" }})"
    - alert: KubeCostAutoscalerAuthFailure
      expr: increase(kubecost_autoscaler_kubecost_api_errors_total{class="auth"}[10m]) > 0
      labels: {severity: critical}
      annotations:
        summary: "KubeCost rejects the operator credentials; the cost policy cannot be evaluated"
    - alert: KubeCostAutoscalerFallbackActive
      expr: kubecost_autoscaler_fallback_active == 1
      for: 5m
      labels: {severity: warning}
      annotations:
        summary: "{{ "{{ $labels.namespace }}/{{ $labels.name }}" }} is scaled by the native CPU HPA fallback"
    - alert: KubeCostAutoscalerScaleFailures
      expr: sum by (namespace, name) (increase(kubecost_autoscaler_scaling_action_total{result="error"}[15m])) > 3
      labels: {severity: critical}
      annotations:
        summary: "Repeated replica write failures for {{ "{{ $labels.namespace }}/{{ $labels.name }}" }}"
    - alert: KubeCostAutoscalerOverBudget
      expr: kubecost_autoscaler_hourly_cost_usd > kubecost_autoscaler_budget_usd and kubecost_autoscaler_budget_usd > 0
      for: 30m
      labels: {severity: warning}
      annotations:
        summary: "{{ "{{ $labels.namespace }}/{{ $labels.name }}" }} exceeds its hourly budget (safety capacity is still provisioned)"
    - alert: KubeCostAutoscalerPaused
      expr: kubecost_autoscaler_paused == 1
      for: 1h
      labels: {severity: warning}
      annotations:
        summary: "{{ "{{ $labels.namespace }}/{{ $labels.name }}" }} has been paused for over an hour: nothing is scaling it"
    - alert: KubeCostAutoscalerDemandMetricsStale
      expr: kubecost_autoscaler_demand_metric_age_seconds > 120
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "Resource metrics behind {{ "{{ $labels.namespace }}/{{ $labels.name }}" }} are over 2 minutes old: decisions lag the load"
    - alert: KubeCostAutoscalerKubeCostSlow
      expr: histogram_quantile(0.95, sum by (le) (rate(kubecost_autoscaler_kubecost_request_duration_seconds_bucket{outcome="ok"}[15m]))) > 10
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "KubeCost allocation queries take over 10 s at p95: risk of stale cost data"
    - alert: KubeCostAutoscalerReconcileSlow
      expr: histogram_quantile(0.99, sum by (le) (rate(kubecost_autoscaler_reconcile_duration_seconds_bucket[15m]))) > 20
      for: 15m
      labels: {severity: warning}
      annotations:
        summary: "KubeCostAutoscaler reconciles take over 20 s at p99"
    - alert: KubeCostHPAOperatorDown
      expr: absent(up{job=~".*kubecost-auto-hpa.*operator.*"} == 1)
      for: 10m
      labels: {severity: warning}
      annotations:
        summary: "KubeCost Auto-HPA operator metrics are missing"
{{- end }}
