{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "kch.name" . }}-dashboard
  labels:
    {{- include "kch.labels" . | nindent 4 }}
    {{ .Values.grafanaDashboard.label }}: {{ .Values.grafanaDashboard.labelValue | quote }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  kubecost-autoscaler.json: |-
{{ .Files.Get "dashboards/kubecost-autoscaler.json" | indent 4 }}
{{- end }}
