{{- $standby := gt (int .Values.engine.replicas) 1 }}
{{- if and .Values.tls.engine.clientSecretName (not .Values.tls.engine.secretName) }}
{{- fail "tls.engine.clientSecretName requires tls.engine.secretName" }}
{{- end }}
{{- $sqlite := and .Values.engine.persistence.enabled (not .Values.engine.postgres.secretName) }}
{{- if and $standby (not .Values.engine.postgres.secretName) }}
{{- fail "Multiple engine replicas require a shared PostgreSQL database" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kch.name" . }}-engine
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.engine.replicas }}
  {{- if $standby }}
  strategy: {type: RollingUpdate, rollingUpdate: {maxSurge: 1, maxUnavailable: 100%}}
  {{- else }}
  strategy: {type: Recreate}
  {{- end }}
  selector:
    matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      {{- if $standby }}
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        labelSelector:
          matchLabels: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 12 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 65532, fsGroup: 65532, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: engine
        image: "{{ .Values.engine.image.repository }}:{{ .Values.engine.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.engine.image.pullPolicy }}
        env:
        - {name: MAX_WORKERS, value: {{ .Values.engine.http.maxWorkers | quote }}}
        - {name: HTTP_SOCKET_TIMEOUT_SECONDS, value: {{ .Values.engine.http.socketTimeoutSeconds | quote }}}
        {{- if .Values.engine.stripeCheckout.secretName }}
        {{- if not (or $sqlite .Values.engine.postgres.secretName) }}
        {{- fail "Stripe Checkout requires persistent engine storage" }}
        {{- end }}
        - {name: STRIPE_CHECKOUT_MODE, value: {{ .Values.engine.stripeCheckout.mode | quote }}}
        {{- range $key := list "STRIPE_SECRET_KEY" "STRIPE_WEBHOOK_SECRET" "STRIPE_CHECKOUT_PRICES" "STRIPE_CHECKOUT_SUCCESS_URL" "STRIPE_CHECKOUT_CANCEL_URL" }}
        - name: {{ $key }}
          valueFrom: {secretKeyRef: {name: {{ $.Values.engine.stripeCheckout.secretName | quote }}, key: {{ $key }}}}
        {{- end }}
        {{- end }}
        {{- if $standby }}
        - {name: POSTGRES_STANDBY, value: "true"}
        {{- end }}
        {{- if .Values.tls.engine.clientSecretName }}
        - {name: LOCAL_READINESS_PORT, value: "8001"}
        {{- end }}
        - {name: ENABLE_AUTOMATED_CONSOLIDATION, value: "false"}
        {{- if .Values.engine.retention.enabled }}
        - {name: TELEMETRY_RETENTION_DAYS, value: {{ .Values.engine.retention.days | quote }}}
        - {name: TELEMETRY_RETENTION_INTERVAL_SECONDS, value: {{ .Values.engine.retention.intervalSeconds | quote }}}
        {{- end }}
        {{- if .Values.engine.postgres.secretName }}
        - name: POSTGRES_DSN
          valueFrom: {secretKeyRef: {name: {{ .Values.engine.postgres.secretName }}, key: {{ .Values.engine.postgres.key }}}}
        - {name: STANDALONE_SINGLE_REPLICA, value: "true"}
        {{- end }}
        {{- if $sqlite }}
        - {name: SAAS_DB_PATH, value: /data/control-plane.db}
        - {name: STANDALONE_SINGLE_REPLICA, value: "true"}
        {{- end }}
        {{- if .Values.auth.engine.secretName }}
        - name: ENGINE_TOKEN
          valueFrom: {secretKeyRef: {name: {{ .Values.auth.engine.secretName }}, key: {{ .Values.auth.engine.key }}}}
        {{- end }}
        {{- if .Values.tls.engine.secretName }}
        - {name: TLS_CERT, value: /tls/tls.crt}
        - {name: TLS_KEY, value: /tls/tls.key}
        {{- if .Values.tls.engine.clientSecretName }}
        - {name: TLS_CLIENT_CA, value: /tls/ca.crt}   # mTLS: only clients signed by this CA are accepted
        {{- end }}
        {{- end }}
        {{- if .Values.telemetry.enabled }}
        - name: NEXUS_TELEMETRY_ENABLED
          value: "true"
        {{- end }}
        {{- if or .Values.telemetry.redisUrl .Values.redis.enabled }}
        - name: REDIS_URL
          value: {{ .Values.telemetry.redisUrl | default (printf "redis://%s/0" (include "kch.redisAddr" .)) | quote }}
        {{- end }}
        {{- if .Values.telemetry.enabled }}
        {{- if .Values.telemetry.stream }}
        - name: NEXUS_TELEMETRY_STREAM
          value: {{ .Values.telemetry.stream | quote }}
        {{- end }}
        {{- if .Values.telemetry.tenantId }}
        - name: NEXUS_TENANT_ID
          value: {{ .Values.telemetry.tenantId | quote }}
        {{- end }}
        {{- end }}
        ports: [{name: http, containerPort: 8000}]
        {{- if .Values.tls.engine.clientSecretName }}
        {{- if not $standby }}
        livenessProbe: {tcpSocket: {port: http}}
        {{- end }}
        readinessProbe:
          exec:
            command: ["python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/readyz', timeout=4)"]
          timeoutSeconds: 5
        {{- else }}
        {{- $scheme := ternary "HTTPS" "HTTP" (ne .Values.tls.engine.secretName "") }}
        {{- if not $standby }}
        livenessProbe: {httpGet: {path: /healthz, port: http, scheme: {{ $scheme }}}}
        {{- end }}
        readinessProbe: {httpGet: {path: /readyz, port: http, scheme: {{ $scheme }}}, timeoutSeconds: 5}
        {{- end }}
        resources: {{- toYaml .Values.engine.resources | nindent 10 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        {{- if or .Values.tls.engine.secretName $sqlite }}
        volumeMounts:
        {{- if .Values.tls.engine.secretName }}
        - {name: tls, mountPath: /tls, readOnly: true}
        {{- end }}
        {{- if $sqlite }}
        - {name: data, mountPath: /data}
        {{- end }}
      volumes:
        {{- if .Values.tls.engine.secretName }}
      - {name: tls, secret: {secretName: {{ .Values.tls.engine.secretName }}}}
        {{- end }}
        {{- if $sqlite }}
      - name: data
        persistentVolumeClaim: {claimName: {{ include "kch.name" . }}-engine}
        {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "kch.name" . }}-engine
  labels: {{- include "kch.labels" . | nindent 4 }}
spec:
  selector: {{- include "kch.selector" (dict "ctx" . "component" "engine") | nindent 4 }}
  ports: [{name: http, port: 8000, targetPort: http}]
