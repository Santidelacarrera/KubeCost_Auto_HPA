apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kch.name" . }}
  labels: {{- include "kch.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "kch.name" . }}
  labels: {{- include "kch.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
- apiGroups: [""]
  resources: [nodes]
  verbs: [get, list, patch, watch]
- apiGroups: [""]
  resources: [pods]
  verbs: [get, list, watch]
- apiGroups: [""]
  resources: [pods/eviction]
  verbs: [create]
- apiGroups: [""]
  resources: [pods/resize]
  verbs: [patch, update]
- apiGroups: [apps]
  resources: [deployments]
  verbs: [get, list, watch]
- apiGroups: [autoscaling.kubecost.io]
  resources: [kubecosthpas]
  verbs: [create, delete, get, list, patch, update, watch]
- apiGroups: [autoscaling.kubecost.io]
  resources: [kubecosthpas/finalizers]
  verbs: [update]
- apiGroups: [autoscaling.kubecost.io]
  resources: [kubecosthpas/status]
  verbs: [get, patch, update]
- apiGroups: [policy]
  resources: [poddisruptionbudgets]
  verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "kch.name" . }}
  labels: {{- include "kch.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: {{ include "kch.name" . }}}
subjects:
- {kind: ServiceAccount, name: {{ include "kch.name" . }}, namespace: {{ .Release.Namespace }}}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kch.name" . }}-leader-election
  labels: {{- include "kch.labels" . | nindent 4 }}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kch.name" . }}-leader-election
  labels: {{- include "kch.labels" . | nindent 4 }}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ include "kch.name" . }}-leader-election}
subjects:
- {kind: ServiceAccount, name: {{ include "kch.name" . }}, namespace: {{ .Release.Namespace }}}
