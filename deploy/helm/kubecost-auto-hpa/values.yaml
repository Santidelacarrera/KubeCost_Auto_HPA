operator:
  extraArgs: []          # e.g. ["--prometheus-ca-file=/ca/ca.crt"]
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  image: {repository: ghcr.io/santidelacarrera/kubecost-auto-hpa-operator, tag: "", pullPolicy: IfNotPresent}
  replicas: 2
  leaderElect: true
  enableSpotDrain: true
  enableCostAutoscaler: true   # KubeCostAutoscaler controller (needs kubecost.url)
  kubecostMaxAttempts: 3
  drainTimeout: 2m
  cpuPricePerCoreHour: "0.031"
  memPricePerGiBHour: "0.004"
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

engine:
  podDisruptionBudget: {enabled: true, minAvailable: 1}
  image: {repository: ghcr.io/santidelacarrera/kubecost-auto-hpa-engine, tag: "", pullPolicy: IfNotPresent}
  replicas: 2
  resources:
    requests: {cpu: 25m, memory: 48Mi}
    limits: {memory: 128Mi}

# Data sources
prometheus:
  url: http://prometheus-server.monitoring:80
kubecost:
  url: http://kubecost-cost-analyzer.kubecost:9090   # empty disables budget guardrails

# Redis: bundled cache, or point at your own.
redis:
  enabled: true
  external:
    addr: ""          # used when enabled=false, e.g. my-redis:6379
    passwordSecret: {name: "", key: password}
  image: redis:7.4-alpine
  maxmemory: 64mb

serviceMonitor:
  enabled: false

# Authentication: bearer tokens kept in Secrets (never in values).
auth:
  engine:     {secretName: "", key: token}   # engine requires it, operator sends it
  prometheus: {secretName: "", key: token}
  kubecost:   {secretName: "", key: token}

# TLS for the operator -> engine hop. Secrets are standard kubernetes.io/tls (+ ca.crt).
tls:
  engine:
    secretName: ""         # server cert/key for the engine; enables https
    clientSecretName: ""   # operator client cert/key + ca.crt; enables mTLS when the server secret has ca.crt

networkPolicy:
  enabled: false           # restrict engine/redis ingress to the operator
  # Egress policy for the operator itself. The operator needs: DNS, the Kubernetes API
  # server, Prometheus, KubeCost, the engine and Redis. The API server cannot be selected by
  # labels, so list your cluster's rules explicitly (see docs/KUBECOST_AUTOSCALER.md).
  operatorEgress:
    enabled: false
    rules: []              # raw NetworkPolicyEgressRule list

prometheusRule:
  enabled: false           # alerts (needs the Prometheus Operator CRDs)
