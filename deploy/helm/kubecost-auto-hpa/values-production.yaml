# Production Hardened Values for KubeCost_Auto_HPA (Nexus Security & AI Lab — Pillar 2)
# Validates strictly against deploy/helm/kubecost-auto-hpa/values.schema.json
operator:
  extraArgs: []  # Admission webhook requires a separate TLS implementation before exposure
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: ghcr.io/santidelacarrera/kubecost-auto-hpa-operator
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 2
  leaderElect: true
  enableSpotDrain: false
  enableCostAutoscaler: true
  kubecostMaxAttempts: 3
  drainTimeout: 2m
  cpuPricePerCoreHour: "0.031"
  memPricePerGiBHour: "0.004"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

engine:
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  image:
    repository: ghcr.io/santidelacarrera/kubecost-auto-hpa-engine
    tag: ""
    pullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  persistence:
    enabled: true
    size: 1Gi
    storageClass: ""

prometheus:
  url: http://prometheus-server.monitoring:80

kubecost:
  url: http://kubecost-cost-analyzer.kubecost:9090

redis:
  enabled: true
  external:
    addr: ""
    passwordSecret:
      name: ""
      key: password
  image: redis:7.4-alpine
  maxmemory: 128mb

serviceMonitor:
  enabled: true

auth:
  engine:
    secretName: kubecost-engine-auth
    key: token
  prometheus:
    secretName: ""
    key: token
  kubecost:
    secretName: ""
    key: token

tls:
  engine:
    secretName: kubecost-engine-server-tls
    clientSecretName: kubecost-operator-client-tls

telemetry:
  enabled: false
  stream: "nexus:telemetry"
  tenantId: ""

networkPolicy:
  enabled: true
  operatorEgress:
    enabled: false
    rules: []

prometheusRule:
  enabled: true

grafanaDashboard:
  enabled: true
  label: grafana_dashboard
  labelValue: "1"
  annotations:
    grafana_folder: "Nexus FinOps & Kubernetes Economics"
