---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: kubecosthpas.autoscaling.kubecost.io
spec:
  group: autoscaling.kubecost.io
  names:
    kind: KubeCostHPA
    listKind: KubeCostHPAList
    plural: kubecosthpas
    shortNames:
    - kchpa
    singular: kubecosthpa
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.desiredCPUMillicores
      name: CPU(m)
      type: integer
    - jsonPath: .status.lastAction
      name: Action
      type: string
    - jsonPath: .status.costPerRequest
      name: $/req
      type: string
    - jsonPath: .status.budgetFrozen
      name: Frozen
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KubeCostHPA is the Schema for the kubecosthpas API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: KubeCostHPASpec defines the desired state of KubeCostHPA.
            properties:
              budget:
                description: Budget freezes growth when the monthly spend of the namespace
                  reaches the limit.
                properties:
                  monthlyLimitUSD:
                    description: MonthlyLimitUSD is the namespace monthly budget in
                      USD.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  onSpendUnavailable:
                    default: Ignore
                    description: |-
                      OnSpendUnavailable decides what happens when KubeCost cannot be reached.
                      Ignore keeps serving the SLO (budget not enforced that cycle); FreezeGrowth
                      treats the budget as exhausted, blocking growth until spend is known again.
                    enum:
                    - Ignore
                    - FreezeGrowth
                    type: string
                required:
                - monthlyLimitUSD
                type: object
              cooldown:
                default: 5m
                description: Cooldown is the minimum time between two resize actions.
                type: string
              cpu:
                default: {}
                description: CPUBounds limits how far the operator may resize CPU
                  requests.
                properties:
                  max:
                    anyOf:
                    - type: integer
                    - type: string
                    default: "4"
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  min:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 100m
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
                x-kubernetes-validations:
                - message: cpu.min must be <= cpu.max
                  rule: '!has(self.min) || !has(self.max) || quantity(self.min).compareTo(quantity(self.max))
                    <= 0'
              dryRun:
                default: false
                description: DryRun computes and reports decisions without touching
                  pods.
                type: boolean
              interval:
                default: 1m
                description: Interval is how often the workload is re-evaluated.
                type: string
              memory:
                description: Memory enables memory resizing when set.
                properties:
                  max:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 16Gi
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  min:
                    anyOf:
                    - type: integer
                    - type: string
                    default: 64Mi
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
                x-kubernetes-validations:
                - message: memory.min must be <= memory.max
                  rule: '!has(self.min) || !has(self.max) || quantity(self.min).compareTo(quantity(self.max))
                    <= 0'
              metrics:
                description: Metrics overrides the default PromQL queries.
                properties:
                  cpuUsageQuery:
                    maxLength: 2048
                    type: string
                  memUsageQuery:
                    maxLength: 2048
                    type: string
                  p99Query:
                    maxLength: 2048
                    type: string
                  rpsQuery:
                    maxLength: 2048
                    type: string
                type: object
              replicas:
                description: Replicas enables horizontal scaling when set.
                properties:
                  max:
                    format: int32
                    minimum: 1
                    type: integer
                  min:
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - max
                - min
                type: object
                x-kubernetes-validations:
                - message: replicas.max must be >= replicas.min
                  rule: self.max >= self.min
              slo:
                description: SLO is the latency objective used to decide whether resources
                  can shrink.
                properties:
                  p99LatencyMs:
                    description: P99LatencyMs is the commercial p99 latency target
                      in milliseconds.
                    format: int32
                    minimum: 1
                    type: integer
                required:
                - p99LatencyMs
                type: object
              spot:
                default: {}
                description: SpotSpec controls Spot awareness for the workload.
                properties:
                  enabled:
                    default: false
                    type: boolean
                  faultTolerant:
                    description: FaultTolerant marks the workload as safe to run on
                      interruptible capacity.
                    type: boolean
                  minReplicas:
                    default: 2
                    format: int32
                    minimum: 1
                    type: integer
                type: object
              targetRef:
                description: TargetRef points at the workload being scaled. Only Deployments
                  are supported.
                properties:
                  containerName:
                    description: ContainerName is the container to resize. Defaults
                      to the first container.
                    type: string
                  kind:
                    default: Deployment
                    enum:
                    - Deployment
                    type: string
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              unitEconomics:
                description: UnitEconomics configures cost-per-request evaluation.
                properties:
                  cpuPricePerCoreHour:
                    description: CPUPricePerCoreHour in USD. Falls back to the operator
                      default when zero.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  maxCostPerRequest:
                    description: MaxCostPerRequest in USD. When exceeded and the SLO
                      has slack, the pod shrinks.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                  memPricePerGiBHour:
                    description: MemPricePerGiBHour in USD. Falls back to the operator
                      default when zero.
                    pattern: ^[0-9]+(\.[0-9]+)?$
                    type: string
                type: object
            required:
            - slo
            - targetRef
            type: object
          status:
            description: KubeCostHPAStatus defines the observed state of KubeCostHPA.
            properties:
              budgetFrozen:
                type: boolean
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              costPerRequest:
                type: string
              desiredCPUMillicores:
                description: DesiredCPUMillicores is the CPU request the operator
                  converges pods to.
                format: int64
                type: integer
              desiredMemoryMiB:
                format: int64
                type: integer
              desiredReplicas:
                format: int32
                type: integer
              lastAction:
                type: string
              lastEvaluationTime:
                format: date-time
                type: string
              lastReason:
                type: string
              lastResizeAction:
                description: LastResizeAction is "grow" or "shrink" for the last applied
                  change (drives the asymmetric cooldown).
                type: string
              lastResizeTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              p99LatencyMs:
                type: string
              rps:
                type: string
              spotEligible:
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
