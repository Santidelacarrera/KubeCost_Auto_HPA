name: ci
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest && PYTHONPATH=engine python -m pytest engine -q
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: operator/go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Unit + integration (real Python engine)
        working-directory: operator
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -tags integration -count=1 ./...
      - name: Known vulnerabilities in dependencies
        working-directory: operator
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...
  envtest:
    # Reconciler, drainer and the real manager binary against a real kube-apiserver 1.33 + etcd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: operator/go.mod}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install kube-apiserver 1.33 and etcd
        run: |
          mkdir -p "$RUNNER_TEMP/envtest"
          curl -fsSL -o "$RUNNER_TEMP/envtest/kube-apiserver" https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kube-apiserver
          curl -fsSL https://github.com/etcd-io/etcd/releases/download/v3.5.21/etcd-v3.5.21-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/envtest" etcd-v3.5.21-linux-amd64/etcd
          chmod +x "$RUNNER_TEMP"/envtest/*
          echo "KUBEBUILDER_ASSETS=$RUNNER_TEMP/envtest" >> "$GITHUB_ENV"
      - working-directory: operator
        run: go test -tags "envtest integration" -count=1 ./internal/controller/...
  e2e-kind:
    # Real cluster (kind, Kubernetes 1.33): in-place resize without container restarts.
    runs-on: ubuntu-latest
    needs: [engine, operator]
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - run: hack/e2e-kind.sh
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: operator/go.mod}
      - uses: azure/setup-helm@v4
      - name: Generated files are up to date
        working-directory: operator
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.5.0
          make manifests
          git diff --exit-code
      - run: helm lint deploy/helm/kubecost-auto-hpa && helm template r deploy/helm/kubecost-auto-hpa >/dev/null
      - run: kustomize build operator/config/overlays/local >/dev/null
