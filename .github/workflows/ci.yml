name: ci
on:
  workflow_call:
  push:
  pull_request:
# CI only reads the repository; no job needs to write.
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e 'engine[dev,runtime]'
      - run: python -m ruff check engine --select E9,F63,F7,F82
      - run: python -m pytest engine -q --junitxml=engine-results.xml --cov=kubecost_engine --cov-fail-under=80 --cov-report=xml
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: engine-evidence
          path: |
            engine-results.xml
            coverage.xml
      - name: Benchmark and script checks
        run: |
          python -m pytest benchmarks validation/test_verification_runner.py -q
          python -m py_compile scripts/*.py benchmarks/bench.py
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: local-validation-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e 'engine[dev,runtime]'
      - run: python -m pytest engine/tests/test_postgres.py -q --junitxml=postgres-results.xml
        env:
          KCA_TEST_POSTGRES_DSN: postgresql://postgres:local-validation-only@127.0.0.1:5432/postgres
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: postgres-evidence, path: postgres-results.xml}
  enterprise-browser-and-redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: pip install -e 'engine[dev,runtime]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest validation/test_console.py validation/test_redis_service.py validation/test_backup.py -q --junitxml=enterprise-e2e.xml
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/15
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: enterprise-browser-redis-evidence, path: enterprise-e2e.xml}
  enterprise-lab:
    runs-on: ubuntu-latest
    needs: [engine, operator]
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - uses: azure/setup-helm@v5
      - run: python hack/local_enterprise_lab.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: enterprise-lab-evidence
          path: |
            .local-validation/enterprise-lab/*.json
            .local-validation/enterprise-lab/*.log
  operational-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - uses: azure/setup-helm@v5
      - run: pip install -e 'engine[dev,runtime]' PyYAML
      - run: python -m pytest validation/test_consolidation_kind.py validation/test_alert_notifications.py validation/test_failover_runtime.py -q --junitxml=operational-results.xml
        env:
          KCA_KIND_CONSOLIDATION: "1"
          KCA_ALERTMANAGER_SMOKE: "1"
          KCA_FAILOVER_SMOKE: "1"
      - uses: actions/upload-artifact@v7
        if: always()
        with: {name: operational-evidence, path: operational-results.xml}
  operator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: operator/go.mod}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Unit + integration (real Python engine)
        working-directory: operator
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go test -race -p 2 ./...
          go test -tags integration -count=1 ./...
      - name: Known vulnerabilities in dependencies
        working-directory: operator
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...
  audit-collector:
    # tools/audit-collector is its own module (minio-go): build, vet and scan it too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: tools/audit-collector/go.mod}
      - working-directory: tools/audit-collector
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go build ./...
          go test -race -count=1 ./...
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)"/bin/govulncheck ./...
  envtest:
    # Reconciler, drainer and the real manager binary against a real kube-apiserver 1.33 + etcd.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: operator/go.mod}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install kube-apiserver 1.33 and etcd
        run: |
          mkdir -p "$RUNNER_TEMP/envtest"
          curl -fsSL -o "$RUNNER_TEMP/envtest/kube-apiserver" https://dl.k8s.io/release/v1.33.4/bin/linux/amd64/kube-apiserver
          curl -fsSL https://github.com/etcd-io/etcd/releases/download/v3.5.21/etcd-v3.5.21-linux-amd64.tar.gz \
            | tar xz --strip-components=1 -C "$RUNNER_TEMP/envtest" etcd-v3.5.21-linux-amd64/etcd
          chmod +x "$RUNNER_TEMP"/envtest/*
          echo "KUBEBUILDER_ASSETS=$RUNNER_TEMP/envtest" >> "$GITHUB_ENV"
      - working-directory: operator
        run: go test -tags "envtest integration" -count=1 ./internal/controller/...
  e2e-kind:
    # Real cluster (kind, Kubernetes 1.33): in-place resize without container restarts.
    runs-on: ubuntu-latest
    needs: [engine, operator]
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - run: hack/e2e-kind.sh
  e2e-kca:
    # Real cluster (kind + metrics-server): KubeCostAutoscaler scales a CPU-bound workload out
    # through the /scale subresource, with KubeCost replaced by a deterministic stub.
    runs-on: ubuntu-latest
    needs: [engine, operator]
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with: {install_only: true, version: v0.27.0}
      - run: hack/e2e-kca.sh
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: {go-version-file: operator/go.mod}
      - uses: azure/setup-helm@v5
      - name: Generated files are up to date
        working-directory: operator
        run: |
          go install sigs.k8s.io/controller-tools/cmd/controller-gen@v0.16.5
          go install sigs.k8s.io/kustomize/kustomize/v5@v5.5.0
          make manifests
          git status
          git diff
          git diff --exit-code
      - run: helm lint deploy/helm/kubecost-auto-hpa && helm template r deploy/helm/kubecost-auto-hpa >/dev/null
      - name: Chart renders with every optional feature enabled
        run: |
          helm template r deploy/helm/kubecost-auto-hpa \
            --set grafanaDashboard.enabled=true --set prometheusRule.enabled=true --set serviceMonitor.enabled=true \
            --set networkPolicy.enabled=true --set networkPolicy.operatorEgress.enabled=true >/dev/null
      - name: RBAC (generated role and Helm role) equals the documented allow-list
        working-directory: operator
        run: REQUIRE_HELM=1 go test -count=1 ./internal/rbaccheck
      - name: values.schema.json rejects a mistyped key
        run: |
          if helm template r deploy/helm/kubecost-auto-hpa --set kubecost.ulr=x >/dev/null 2>&1; then
            echo "schema accepted an unknown value"; exit 1
          fi
      - name: Client TLS cannot silently fall back to plaintext
        run: |
          if helm template r deploy/helm/kubecost-auto-hpa --set tls.engine.clientSecretName=client-only >/dev/null 2>&1; then
            echo "client TLS without server TLS was accepted"; exit 1
          fi
      - name: Safe defaults (observe-only on, applier off) in the chart and in the Kustomize base
        run: |
          helm template r deploy/helm/kubecost-auto-hpa > /tmp/chart.yaml
          grep -q -- "--observe-only=true" /tmp/chart.yaml || { echo "the chart no longer defaults to observe-only"; exit 1; }
          if grep -q -- "--enable-recommendation-applier" /tmp/chart.yaml; then echo "the applier is on by default"; exit 1; fi
          kustomize build operator/config/default > /tmp/base.yaml
          grep -q -- "--observe-only" /tmp/base.yaml || { echo "the Kustomize base no longer starts in observe-only"; exit 1; }
      - name: Chart lints with the production values
        run: helm lint deploy/helm/kubecost-auto-hpa -f deploy/helm/kubecost-auto-hpa/values-production.yaml
      - name: Production engine uses the bundled Redis Service name
        run: |
          helm template redis-check deploy/helm/kubecost-auto-hpa -f deploy/helm/kubecost-auto-hpa/values-production.yaml > /tmp/redis-check.yaml
          grep -F 'name: redis-check-kubecost-auto-hpa-redis' /tmp/redis-check.yaml
          grep -F 'value: "redis://redis-check-kubecost-auto-hpa-redis:6379/0"' /tmp/redis-check.yaml
      - run: kustomize build operator/config/overlays/local >/dev/null
      - run: kustomize build operator/config/overlays/e2e-kca >/dev/null
