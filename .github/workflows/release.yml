name: release
# Publishes images to GHCR on main (tags: sha + latest) and on v* tags (tag: version).
# Only on v* tags it also: attaches an SBOM and SLSA provenance to the images, signs the images and the
# chart keylessly (Sigstore, GitHub OIDC), and pushes the Helm chart as an OCI artifact.
# The tag path has NOT been executed yet (see docs/RELEASING.md): rehearse it before the first tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
# Least privilege by default; each job asks for what it needs.
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - {name: operator, context: operator}
          - {name: engine, context: engine}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # metadata-action lower-cases the repository (GHCR requires it).
          images: ghcr.io/${{ github.repository_owner }}/kubecost-auto-hpa-${{ matrix.name }}
          tags: |
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Version and commit are baked into the operator binary (--version, kubecost_auto_hpa_build_info).
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          # SBOM (SPDX) and provenance attestations only for tagged releases.
          sbom: ${{ startsWith(github.ref, 'refs/tags/v') }}
          provenance: ${{ startsWith(github.ref, 'refs/tags/v') && 'mode=max' || 'false' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  sign:
    # Keyless signing of the version-tagged image index. id-token is requested here only.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        name: [operator, engine]
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: sigstore/cosign-installer@v3.7.0
        with: {cosign-release: v2.4.1}
      - name: Sign and verify the image by digest
        env:
          NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/$OWNER/kubecost-auto-hpa-$NAME"
          VERSION=${GITHUB_REF_NAME#v}
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" | awk '/^Digest:/ {print $2; exit}')
          test -n "$DIGEST"
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign verify "$IMAGE@$DIGEST" \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "signed $IMAGE@$DIGEST"
  chart:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - uses: sigstore/cosign-installer@v3.7.0
        with: {cosign-release: v2.4.1}
      - name: Package, push and sign the chart
        run: |
          set -euo pipefail
          VERSION=${GITHUB_REF_NAME#v}
          # OCI repository names must be lower-case; github.repository_owner keeps its case.
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/kubecost-auto-hpa --version "$VERSION" --app-version "$VERSION"
          OUT=$(helm push "kubecost-auto-hpa-$VERSION.tgz" "oci://ghcr.io/$OWNER/charts" 2>&1)
          echo "$OUT"
          DIGEST=$(echo "$OUT" | awk '/^Digest:/ {print $2; exit}')
          test -n "$DIGEST"
          cosign sign --yes "ghcr.io/$OWNER/charts/kubecost-auto-hpa@$DIGEST"
