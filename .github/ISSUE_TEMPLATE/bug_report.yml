name: Bug Report
description: File a bug report to help improve KubeCost Auto-HPA
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much detail as possible.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      value: |
        1. Deploy KubeCost Auto-HPA version '...'
        2. Create a KubeCostAutoscaler resource with '...'
        3. Observe '...'
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Kubernetes version, KubeCost chart version, architecture (amd64/arm64)
      placeholder: Kubernetes 1.33, kind v0.27.0, linux/amd64
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Logs from the operator or engine pods (`kubectl logs ...`).
      render: shell
