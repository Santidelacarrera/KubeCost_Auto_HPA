# REAL HTTP traffic with REAL latency metrics: the Prometheus example app exposes http_request_duration_seconds, a constant-rate
# load generator calls it, and Prometheus scrapes the pods through the standard annotations. The app is deliberately over-provisioned.
# What this is not: a production-like workload. It is trivial, single-route and low-CPU.
apiVersion: apps/v1
kind: Deployment
metadata: {name: shop, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: shop}}
  template:
    metadata:
      labels: {app: shop}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: "8080", prometheus.io/path: /metrics}
    spec:
      containers:
      - name: app
        image: quay.io/brancz/prometheus-example-app:v0.3.0
        ports: [{containerPort: 8080}]
        readinessProbe: {httpGet: {path: /, port: 8080}, periodSeconds: 5}
        resources:
          requests: {cpu: 500m, memory: 128Mi}
          limits: {cpu: "1", memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata: {name: shop, namespace: lab}
spec: {selector: {app: shop}, ports: [{port: 8080}]}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: loadgen, namespace: lab}
spec:
  replicas: 2
  selector: {matchLabels: {app: loadgen}}
  template:
    metadata: {labels: {app: loadgen}}
    spec:
      containers:
      - name: gen
        image: busybox:1.36
        # about 20 requests per second per generator, forever
        command: ["sh", "-c", "while true; do wget -q -T 2 -O /dev/null http://shop:8080/ || true; sleep 0.05; done"]
        resources: {requests: {cpu: 50m, memory: 16Mi}}
