# Lab workload for the KubeCostAutoscaler: 4 replicas that do almost nothing, so utilisation is far below target
# and the controller will want to scale down. In observe-only mode it must only REPORT that.
apiVersion: apps/v1
kind: Deployment
metadata: {name: scaletest, namespace: lab}
spec:
  replicas: 4
  selector: {matchLabels: {app: scaletest}}
  template:
    metadata: {labels: {app: scaletest}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh", "-c", "while true; do sleep 30; done"]
        resources:
          requests: {cpu: 100m, memory: 32Mi}
          limits: {memory: 64Mi}
---
apiVersion: autoscaling.kubecost.io/v1alpha1
kind: KubeCostAutoscaler
metadata: {name: scaletest, namespace: lab}
spec:
  targetRef: {apiVersion: apps/v1, kind: Deployment, name: scaletest}
  minReplicas: 1
  maxReplicas: 6
  evaluationInterval: 10s
  demand: {resources: [cpu], targetUtilizationPercent: 70, ceilingUtilizationPercent: 90}
  costPolicy: {maxHourlyCostUSD: "5.00", targetHourlyCostUSD: "4.00", window: 5m}
  stabilization: {downscaleWindow: 30s, scaleUpWindow: 10s, minimumScaleActionInterval: 20s}
